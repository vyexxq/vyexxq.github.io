<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>me — vyexx</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a1814;
      --mist: #e8e4dc;
      --wash: #c9d4c8;
    }

    * {
      margin: 0;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100dvh;
      font-family: Syne, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, rgba(255, 255, 255, 0.55), transparent 70%),
        linear-gradient(160deg, var(--mist) 0%, var(--wash) 55%, #b8c5c0 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
      opacity: 0.07;
      pointer-events: none;
    }

    .mark {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1.1rem;
      width: min(34rem, calc(100% - 2.5rem));
      padding: 2rem 0;
      animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    h1 {
      font-size: clamp(3.5rem, 14vw, 8rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 0.95;
    }

    p {
      font-size: clamp(1.05rem, 2.6vw, 1.3rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.4;
      opacity: 0.78;
      max-width: 28rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.35rem;
      margin-top: 0.5rem;
    }

    a {
      font-size: clamp(1.1rem, 2.8vw, 1.4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: inherit;
      text-decoration: none;
      border-bottom: 3px solid currentColor;
    }

    a:hover,
    a:focus-visible {
      opacity: 0.65;
      outline: none;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="mark">
    <h1>me</h1>
    <p>I'm vyexx — a solo artist. I do vocals and video game soundtracks.</p>
    <p>For work, licensing, or anything else, DM <strong>fruityparametriceq2</strong> on Discord.</p>
    <div class="links">
      <a href="/music">music</a>
      <a href="/">back</a>
    </div>
  </div>
</body>
</html>
